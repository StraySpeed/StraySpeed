name: Update GitHub stats cards

on:
  schedule:
    # 매일 00:00 UTC = 한국 시간 09:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"StraySpeed","show_icons":true,"theme":"tokyonight","include_all_commits":true,"rank_icon":"github","show":"prs_merged,prs_reviewed","locale":"en"}'
          path: profile/stats.svg
          core_version: 2.1.5
          fail_on_error: true
          token: ${{ secrets.STRAYSPEED_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: '{"username":"StraySpeed","layout":"compact","langs_count":6,"theme":"tokyonight","locale":"en"}'
          path: profile/top-langs.svg
          core_version: 2.1.5
          fail_on_error: true
          token: ${{ secrets.STRAYSPEED_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No card changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub stats cards"
          git push
